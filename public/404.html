<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Adam Javurek — Portfolio</title>
    <!--
      Single Page Apps for GitHub Pages
      https://github.com/rafgraph/spa-github-pages

      GitHub Pages has no server-side rewrite, so a hard refresh or a shared
      link to a real path like /website/tech returns this 404 page instead of
      index.html. This script rewrites the URL into a query string and
      redirects to index.html, which decodes it back (see the inline script
      in index.html) before React Router ever sees it — so the visitor lands
      on the right page instead of a dead link.

      pathSegmentsToKeep = 1 keeps the "/website" segment (the GitHub Pages
      project path). If you switch to a custom domain served from the root,
      change this to 0 — see vite.config.ts and public/CNAME notes.
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
